name: Daily Paper

on:
  schedule:
    - cron: "0 * * * *" # hourly trigger; actual run time gated by config/skill.yaml schedule.run_time
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-openai.txt
      - name: Run
        env:
          SKILL_PROVIDER: compat_http
          SKILL_AUTH_TOKEN: ${{ secrets.SKILL_AUTH_TOKEN }}
          SKILL_MODEL: ${{ vars.SKILL_MODEL }}
          SKILL_BASE_URL: ${{ vars.SKILL_BASE_URL }}
          ENABLE_FEISHU_WEBHOOK: "true"
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          OPENALEX_EMAIL: your-email@example.com
        run: |
          python scripts/run_from_skill_config.py --respect-time --verbose
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-paper-report
          path: |
            output/md/*.md
            output/feishu_cards/*.json
